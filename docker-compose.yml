services:
  gaugesim:
    build: .
    image: gaugesim:latest
    ports:
      - "8501:8501"
    environment:
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
    volumes:
      - ./.gaugesim_settings.json:/app/.gaugesim_settings.json
    restart: unless-stopped
